version: '3'

services:
  selenium-hub:  # The correct service name for the hub
    image: selenium/hub:latest
    container_name: hub
    ports:
      - "4442-4444:4442-4444"
    environment:
      - GRID_MAX_SESSION=10
    networks:
      - selenium-grid

  selenium-node-chrome:  # Chrome node service
    image: selenium/node-chrome:latest
    depends_on:  # Reference the correct hub service name here
      - selenium-hub
    deploy:
      replicas: 4
    shm_size: 2gb
    networks:
      - selenium-grid
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=5

networks:
  selenium-grid:
    driver: bridge